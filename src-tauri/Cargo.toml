[package]
name = "serialx"
version = "1.0.0"
description = "SerialX Monitor - multi-session serial + Modbus RTU monitor"
authors = ["SerialX"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.7"
base64 = "0.22"
parking_lot = "0.12"
memchr = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Release profile tuned for the hot serial read path.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
