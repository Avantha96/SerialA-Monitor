[package]
name = "seriala-native"
version = "1.0.0"
description = "SerialA Monitor - High-performance native multi-session serial + Modbus RTU monitor"
authors = ["SerialA"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "seriala_native"
path = "src/lib.rs"

[[bin]]
name = "seriala-native"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.29"
egui_plot = "0.29"
egui_extras = "0.29"
serialport = "4.7"
parking_lot = "0.12"
memchr = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1.10"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
